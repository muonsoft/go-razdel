name: Bug
description: Incorrect tokens/sentences, panic, or broken offsets
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include a **minimal** input string. Compare token/sentence **texts** with Python `razdel` before reporting a numeric-offset mismatch (Go uses UTF-8 bytes).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tokenize
        - Sentenize
        - Both
        - Other (offsets, panic, build)
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Exact string (use a fenced code block).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What go-razdel returned, or the panic/stack.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What you expected, and why (Python razdel, a contract, or an example).
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go version
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: go-razdel version
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true
